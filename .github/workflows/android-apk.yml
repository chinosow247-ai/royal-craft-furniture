name: Build Royal Craft Furniture APK
on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create temporary release signing key
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/royalcraft"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/royalcraft/royalcraft-release.jks" \
            -storepass "royalcraft-build" \
            -keypass "royalcraft-build" \
            -alias "royalcraft" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Royal Craft Furniture, OU=Royal Craft Furniture, O=Royal Craft Furniture, L=Port Harcourt, ST=Rivers, C=NG"

      - name: Build signed release APK
        env:
          ROYAL_CRAFT_KEYSTORE: ${{ runner.temp }}/royalcraft/royalcraft-release.jks
          ROYAL_CRAFT_STORE_PASSWORD: royalcraft-build
          ROYAL_CRAFT_KEY_ALIAS: royalcraft
          ROYAL_CRAFT_KEY_PASSWORD: royalcraft-build
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: royal-craft-furniture-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk

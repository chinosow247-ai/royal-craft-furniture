name: Build Royal Craft Furniture APK
on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check release signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ROYAL_CRAFT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ROYAL_CRAFT_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ROYAL_CRAFT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ROYAL_CRAFT_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing ROYAL_CRAFT_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing ROYAL_CRAFT_STORE_PASSWORD repository secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ROYAL_CRAFT_KEY_ALIAS repository secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ROYAL_CRAFT_KEY_PASSWORD repository secret"; exit 1; }

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ROYAL_CRAFT_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/royalcraft"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/royalcraft/royalcraft-release.jks"
          chmod 600 "$RUNNER_TEMP/royalcraft/royalcraft-release.jks"

      - name: Build signed release APK
        env:
          ROYAL_CRAFT_KEYSTORE: ${{ runner.temp }}/royalcraft/royalcraft-release.jks
          ROYAL_CRAFT_STORE_PASSWORD: ${{ secrets.ROYAL_CRAFT_STORE_PASSWORD }}
          ROYAL_CRAFT_KEY_ALIAS: ${{ secrets.ROYAL_CRAFT_KEY_ALIAS }}
          ROYAL_CRAFT_KEY_PASSWORD: ${{ secrets.ROYAL_CRAFT_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: royal-craft-furniture-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
